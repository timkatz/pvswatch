<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background disc so the icon stays visible against any tab color -->
  <circle cx="16" cy="16" r="15" fill="#0f172a"/>
  <!-- Watch bezel -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
  <!-- Sun core -->
  <circle cx="16" cy="16" r="4.5" fill="#f59e0b"/>
  <!-- 8 sun rays inside the bezel -->
  <g stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round">
    <line x1="16" y1="7"  x2="16" y2="9.5"/>
    <line x1="16" y1="22.5" x2="16" y2="25"/>
    <line x1="7"  y1="16" x2="9.5"  y2="16"/>
    <line x1="22.5" y1="16" x2="25" y2="16"/>
    <line x1="9.5"  y1="9.5"  x2="11.5" y2="11.5"/>
    <line x1="20.5" y1="20.5" x2="22.5" y2="22.5"/>
    <line x1="9.5"  y1="22.5" x2="11.5" y2="20.5"/>
    <line x1="20.5" y1="11.5" x2="22.5" y2="9.5"/>
  </g>
</svg>
